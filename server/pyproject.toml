[project]
name = "crv-guide-mcp"
version = "0.1.0"
description = "MCP server that watches a how-to video with crv and turns it into a stateful, evidence-backed step-by-step guide."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=2.1,<2.2",
  "claude-real-video[mlx]==0.10.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "claude-real-video[fast]==0.10.7; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "av<16",
  "google-genai>=1.68",
  "pillow>=10",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "pydantic>=2",
]

[project.scripts]
crv-guide-mcp = "crv_guide_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crv_guide_mcp"]
