<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:#0e141c;color:#f2f5f8;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.wrap{position:absolute;inset:0;padding:100px 140px;display:flex;flex-direction:column;justify-content:center;gap:28px;background:radial-gradient(120% 120% at 0% 0%,#172434 0%,#0e141c 60%)}
h1{font-size:92px;line-height:1.02;margin:0;letter-spacing:-0.02em}
h2{font-size:54px;line-height:1.12;margin:0;letter-spacing:-0.01em}
p{font-size:34px;line-height:1.45;color:#b9c3cf;margin:0;max-width:1560px}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 22px;font-size:26px;color:#b9c3cf;margin:0 12px 10px 0}
.ring{width:56px;height:56px;border-radius:50%;border:8px solid #37c6f4;box-shadow:0 0 30px rgba(55,198,244,.6)}
.accent{color:#ffa234}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.grid img{width:100%;border-radius:10px;display:block}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:start}
.lines{font-family:ui-monospace,Menlo,monospace;font-size:22px;color:#b9c3cf;line-height:1.6}
.lines b{color:#ffa234;font-weight:600}
.small{font-size:24px;color:#7d8896}
</style></head><body><div class="wrap"><h2>A video it has never seen.</h2><p>Empty library, nothing watched yet. The import you see next ran for real.</p></div></body></html>
